services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forme_secret}
      POSTGRES_DB: ${POSTGRES_DB:-forme_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forme} -d ${POSTGRES_DB:-forme_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/sampletppio/forme-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-forme}:${POSTGRES_PASSWORD:-forme_secret}@db:5432/${POSTGRES_DB:-forme_db}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/sampletppio/forme-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
